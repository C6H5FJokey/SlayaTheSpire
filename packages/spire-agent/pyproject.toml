[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spire-agent"
version = "0.1.0"
description = "SlayaTheSpire 的智能体：模组桥接 / Laya 客户端 / 对局采集 / 观战面板"
requires-python = ">=3.11"
dependencies = [
  # 本仓库内的兄弟包：agent 的一切"游戏逻辑"都从 core 借（公平过滤/序列化/构题/裁决）。
  # 装法：pip install -e packages/spire-core -e packages/spire-agent（见 tools/setup_dev.ps1）
  "spire-core",
  "httpx>=0.26",   # 唯一的外部依赖；桥接/面板/自检刻意只用标准库
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
spire-agent = "spire_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
